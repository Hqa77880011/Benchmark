name: Source and config checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile pipeline and model entry points
        run: >-
          python -m compileall -q
          prepare_inputs.py prepare_dataset.py compute.py
          synthesis_pipeline
          unet/config.py unet/train.py unet/trainer.py unet/test.py unet/utils.py
          unet/datasets unet/networks
          yolo/trains.py yolo/predict_masks.py
          sam/download_checkpoint.py sam/predict_masks.py
      - name: Install configuration parser
        run: python -m pip install PyYAML
      - name: Parse pipeline configurations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          yaml_paths = [
              Path(".github/workflows/source.yml"),
              Path("synthesis_pipeline/config.yaml"),
              Path("unet/configs/swin_tiny_patch4_window7_224_lite.yaml"),
          ]
          for path in yaml_paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))

          json_paths = list(Path(".").glob("*.json"))
          for directory in (Path("synthesis_pipeline"), Path("unet/configs")):
              json_paths.extend(directory.rglob("*.json"))
          for path in json_paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Parsed {len(yaml_paths)} YAML and {len(json_paths)} JSON configurations")
          PY
